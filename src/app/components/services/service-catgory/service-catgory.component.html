<section class="advertise-section py-5">
  <div class="container">
    
    <div class="text-center mb-5">
      <h2 class="section-title">Our Advertising Services</h2>
      <p class="section-subtitle">
        Explore powerful solutions to grow your brand visibility
      </p>
    </div>

    <div class="row g-4">
      <div 
        class="col-12 col-sm-6 col-lg-4"
        *ngFor="let category of categories"
      >
        <div class="service-card h-100 text-center p-4" routerLink="/services">

          <div class="icon-wrapper mb-3">
            <i [class]="category.icon"></i>
          </div>

          <h5 class="fw-bold mb-3">{{ category.title }}</h5>

          <p class="text-muted">
            {{ category.description }}
          </p>
        </div>
      </div>
    </div>

  </div>
</section>
